[project]
name = "lc-risk"
version = "0.1.0"
description = "Default-risk model for Lending Club 36-month loans: reproducible training, FastAPI scoring service, and drift monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[project.optional-dependencies]
# Only what the scoring container needs.
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
# Data discovery, training, and evaluation. Never installed in the serving image.
train = [
    "ipykernel>=7.4.0",
    "kagglehub>=1.0",
    "matplotlib>=3.9",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "openpyxl>=3.1",
    "optuna>=4.0",
    "seaborn>=0.13",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Line length is enforced by `ruff format`; long string literals are left alone.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lc_risk", "_common"]
